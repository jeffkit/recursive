# docker-compose.yml — Local cloud-stack for Recursive
#
# Spins up two services:
#   recursive  — the agent HTTP gateway (recursive http), built with
#                `cloud-runtime` so RECURSIVE_S3_BUCKET selects S3
#   localstack — AWS-compatible S3 emulation for transcript/memory storage
#
# Redis is intentionally NOT provisioned: `recursive http` does not consume a
# `RedisSessionStore` (no per-turn checkpoint consumer), and transcripts are
# persisted per turn to S3 instead. See README "Full cloud stack".
#
# Usage:
#   docker compose up          # start both services
#   docker compose up recursive # start only the agent (requires external S3 or defaults)
#
# Build the image first (or rely on published image):
#   docker build -t recursive:dev --target runtime --build-arg FEATURES=http,cloud-runtime .
#
# Minimum required env:
#   RECURSIVE_API_KEY — your LLM provider API key (passed via .env or -e)

version: "3.9"

services:
  # ── Recursive Agent Gateway ──────────────────────────────────────────────
  recursive:
    image: recursive:dev
    build:
      context: .
      target: runtime
      args:
        RUST_VERSION: "1.86"
        # Issue #92: cloud-runtime wires `RECURSIVE_S3_BUCKET` to the shared
        # S3 transcript backend. Without it the env var below is inert.
        FEATURES: "http,cloud-runtime"
    ports:
      - "3000:3000"
    environment:
      # ── LLM provider (required) ──
      RECURSIVE_API_BASE: "${RECURSIVE_API_BASE:-https://api.openai.com/v1}"
      RECURSIVE_API_KEY: "${RECURSIVE_API_KEY:?Set RECURSIVE_API_KEY}"
      RECURSIVE_MODEL: "${RECURSIVE_MODEL:-gpt-4o-mini}"
      RECURSIVE_PROVIDER_TYPE: "${RECURSIVE_PROVIDER_TYPE:-openai}"

      # ── Agent behaviour ──
      RECURSIVE_MAX_STEPS: "${RECURSIVE_MAX_STEPS:-32}"
      RECURSIVE_TEMPERATURE: "${RECURSIVE_TEMPERATURE:-0.2}"
      RECURSIVE_SYSTEM_PROMPT_FILE: "${RECURSIVE_SYSTEM_PROMPT_FILE:-}"

      # ── HTTP server ──
      RECURSIVE_HTTP_AUTH_KEYS: "${RECURSIVE_HTTP_AUTH_KEYS:-}"

      # ── Cloud storage backend (S3 via LocalStack) ──
      # Issue #92: transcripts are appended per turn and cold-loaded on
      # restart, so a crashed gateway loses at most the in-flight turn.
      RECURSIVE_S3_BUCKET: "recursive-dev"
      RECURSIVE_S3_PREFIX: "transcripts"
      RECURSIVE_S3_TENANT_ID: "local"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_ENDPOINT_URL: "http://localstack:4566"
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  # ── LocalStack — S3-compatible object storage ─────────────────────────────
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      LOCALSTACK_VOLUME_DIR: /var/lib/localstack
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

volumes:
  localstack_data:
