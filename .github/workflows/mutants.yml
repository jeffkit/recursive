# Mutation — cargo-mutants 变异测试的 CI 入口（复用 .dev/scripts 的三个门脚本，
# 与 self-improve flow 的 .flowcast/gates.json 用同一套判定语义）。
#
# 三个 job：
#   incremental (PR 门禁) — 三个脚本无参跑（默认增量作用域）：
#       agent / tui 走 --in-diff 函数级差分（只变异 diff 触及的函数，实测
#       6 函数 ≈26 变异点 ≈3-4min）；cli 目前是文件级（main.rs 单文件
#       ~150 个可变点，是慢的来源，预算参考 gates.json 的 150min）。
#       各脚本「未动本 crate 即 exit 0 跳过」，一次 PR 通常只付一个 crate。
#   full-baseline (双周)  — 每个 crate 一个 job，--all 全量基线。本地参考：
#       agent 69 变异点 ≈10-15min（14 核 8 jobs）、cli ~242 个 ≈110-120min
#       （32GB）。CI 托管 runner 只有 4 核，预算给 5.5h（6h 是单 job 上限）。
#       若超时或磁盘吃紧（runner 可用 ~14GB，4 份 copy 各带独立 target），
#       降到 --jobs 2，或挂一台 self-hosted runner。
#   regression (双周)     — 完整编译回归：全特性编译 + 默认特性全测 +
#       全特性 clippy + fmt（= 本地强制质量门的完整集）。
#
# 定时：与 e2e.yml 相同（每月 1/15 日 18:37 UTC ≈ 北京 2/16 日 02:37）；
# 想改每月一次：cron 改 "37 18 1 * *"。
#
# rollout：三个 job 目前都是 continue-on-error: true（advisory）——先跑出
# 真实时长与幸存者噪音水平，再逐个摘掉改阻塞。

name: Mutation

on:
  pull_request:
    paths:
      - src/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - .github/workflows/mutants.yml
  push:
    branches: [main]
    paths:
      - src/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - .github/workflows/mutants.yml
  workflow_dispatch:
    inputs:
      scope:
        description: "incremental = 只测相对 main 的改动；full = 全 crate 基线 + 完整回归"
        type: choice
        options:
          - incremental
          - full
        default: incremental
      agent_shards:
        description: 'recursive-agent 分片模式：JSON matrix（{"shard": [["src/a.rs", …], …]}）。设置后跳过 full/regression，按文件清单并行跑 agent 分片（每个 ≤~850 变异体，330min 内可完成；--all 全量在 4 核 runner 实证两度超 330min，见 run 40598348438 / 40927380347）'
        type: string
        default: ""
  schedule:
    - cron: "37 18 1,15 * *"

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 关掉 dev profile 的 debug info：copy 模式每份副本独立 target，这是控制
  # 磁盘与编译时长的主要杠杆（gates.json 对 cli-mutants 的结构化建议同款）。
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # ── push→main 落地门（2026-10-09，接替沙箱内 tui-mutants）─────────────────
  # keeper 管线落地直接进 main（push_mode: main），PR 门看不到这些提交；
  # 变异测试改在落地后于 CI 补跑：文件级作用域（与本地各 *-mutants.sh 门同
  # 语义，显式传文件 = 整文件作用域），红则按 docs/ISSUE_FILING_GUIDE.md 自动
  # 建档（P2）交给 keeper 派发修复 goal——effectiveness loop 保留，但自迭代
  # 沙箱不再为 mutants 花 40-150 分钟/轮（也不再往沙箱装 cargo-mutants）。
  main-push:
    name: mutants (push to main)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    if: github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # HEAD^..HEAD diff（merge commit 取第一父）

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-mutants-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mutants-cargo-

      - name: Cache cargo-mutants binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('.github/workflows/mutants.yml') }}

      - name: Install cargo-mutants
        run: command -v cargo-mutants >/dev/null 2>&1 || cargo install cargo-mutants --locked

      - name: Configure git identity
        run: |
          git config --global user.email "ci@recursive.local"
          git config --global user.name "CI Bot"
          git config --global safe.directory "*"

      - name: Resolve changed files (HEAD^..HEAD)
        id: scope
        run: |
          git diff --name-only 'HEAD^..HEAD' > /tmp/changed.txt 2>/dev/null || true
          agent_list=""; cli_list=""; tui_list=""
          while IFS= read -r f; do
            case "$f" in
              src/*.rs)
                case "$f" in src/weixin/*|src/test_util.rs) continue ;; esac
                agent_list="$agent_list $f" ;;
              crates/recursive-cli/src/*) cli_list="$cli_list $f" ;;
              crates/recursive-tui/src/*.rs) tui_list="$tui_list $f" ;;
            esac
          done < /tmp/changed.txt
          {
            echo "agent=${agent_list# }"
            echo "cli=${cli_list# }"
            echo "tui=${tui_list# }"
          } >> "$GITHUB_OUTPUT"

      - name: Run mutants (per crate, files scope)
        id: mutants
        env:
          AGENT_FILES: ${{ steps.scope.outputs.agent }}
          CLI_FILES: ${{ steps.scope.outputs.cli }}
          TUI_FILES: ${{ steps.scope.outputs.tui }}
        run: |
          survivors=""; baseline_failed=""
          # 分诊口径（#201/#195，2026-10-25）：脚本退出码语义见 *-mutants.sh —
          #   0 = 过；1 = cargo-mutants 基线/测试失败**原样透传**（非幸存者，
          #       #195 三次假信号教训：基线失败曾被记成「变异幸存」开单）；
          #   2 = 有 MISSED（真幸存者，gate FAIL）；其余非零 = 前置拒绝
          #       （脏树 exit 3 / 未安装 exit 2），按幸存者路径处理（保守红）。
          run_crate() {  # run_crate <crate-name> <script> <files...>
            local crate="$1"; local script="$2"; shift 2
            local rc=0
            echo "::group::${crate}-mutants ($# files)"
            bash "$script" "$@" || rc=$?
            echo "::endgroup::"
            echo "exit codes: ${crate}=${rc}" | tee -a /tmp/mutants-exit-codes.txt
            if [[ "$rc" -eq 0 ]]; then return 0; fi
            if [[ "$rc" -eq 1 ]]; then
              baseline_failed="${baseline_failed:+$baseline_failed }${crate}"
              echo "::error::baseline failed in ${crate} (exit 1 — baseline/test failure, NOT survivors; see #195)"
            else
              survivors="${survivors:+$survivors }${crate}"
            fi
          }
          if [[ -n "$AGENT_FILES$CLI_FILES$TUI_FILES" ]]; then
            rm -f /tmp/mutants-exit-codes.txt
            if [[ -n "$AGENT_FILES" ]]; then
              read -ra F <<< "$AGENT_FILES"
              run_crate agent .dev/scripts/agent-mutants.sh "${F[@]}"
            fi
            if [[ -n "$CLI_FILES" ]]; then
              read -ra F <<< "$CLI_FILES"
              run_crate cli .dev/scripts/cli-mutants.sh "${F[@]}"
            fi
            if [[ -n "$TUI_FILES" ]]; then
              read -ra F <<< "$TUI_FILES"
              run_crate tui .dev/scripts/tui-mutants.sh "${F[@]}"
            fi
          else
            echo "no crate sources changed in this push — nothing to mutate"
            exit 0
          fi
          {
            echo "survivors=${survivors}"
            echo "baseline_failed=${baseline_failed}"
          } >> "$GITHUB_OUTPUT"
          if [[ -n "$baseline_failed" ]]; then
            echo "mutants BASELINE FAILED in:$baseline_failed — not filing a survivor issue (#195 lesson)"
          fi
          if [[ -n "$survivors" ]]; then
            echo "mutants survivors in:$survivors"
          fi
          if [[ -n "$baseline_failed$survivors" ]]; then
            exit 1
          fi

      # 幸存者 → 自动建档（P2）给 keeper 派发修复 goal；查重：已有同前缀 open
      # 单只回评，不重复开单（ISSUE_FILING_GUIDE 禁止重复提报）。
      # 基线失败（exit 1）**不得**进本步——那不是幸存者，开「变异幸存」单是
      # #195 实证三次的假信号；基线失败只留 ::error:: 日志（上游 Run 步）。
      # survivors 输出为空也拦住「更早步骤失败」误入本步的旧假信号类。
      - name: File keeper issue on survivors
        if: failure() && steps.mutants.outputs.survivors != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_SHORT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="test(gates): main 落地变异测试幸存（${SHA_SHORT:0:8}）"
          BODY="$(cat <<BODY_EOF
          > 优先级 **P2** · 依赖：无

          基线 HEAD = ${SHA_SHORT:0:7}

          ## Summary
          push→main 落地门（mutants.yml / main-push job）在 CI 上检出变异测试幸存者。
          - 运行记录：$RUN_URL
          - 幸存者清单见该 run 的「Run mutants (per crate, files scope)」步骤日志（MISSED 段）

          ## 影响
          对应行为的测试存在但未钉住改动语义——mutant 幸存意味着测试全绿的情况下
          行为仍可被破坏而不被发现。

          ## 建议
          按 run 日志 MISSED 清单强化对应测试，使每个幸存 mutant 被杀。验收：本地
          复跑对应 crate 的 *-mutants.sh（显式传同批文件）零幸存。
          BODY_EOF
          )"
          EXISTING="$(gh issue list -R jeffkit/recursive --state open \
            --search "main 落地变异测试幸存 in:title" --json number --jq 'length' 2>/dev/null || echo 0)"
          if [[ "$EXISTING" -gt 0 ]]; then
            LAST="$(gh issue list -R jeffkit/recursive --state open \
              --search "main 落地变异测试幸存 in:title" --json number --jq '.[0].number')"
            gh issue comment "$LAST" -R jeffkit/recursive --body "$BODY"
            echo "commented on existing issue #$LAST"
          else
            gh issue create -R jeffkit/recursive --title "$TITLE" --body "$BODY"
          fi

  incremental:
    name: mutants (diff vs main)
    runs-on: ubuntu-latest
    # 常规 PR（函数级差分）分钟级；最坏情形 cli 文件级作用域碰上 main.rs
    # 是小时级 —— 预算 180min，超时即被 SIGKILL（gates.json 失败模式 #8 同款
    # 症状：报告没有收尾汇总行。真发生时不要缩脚本作用域，改预算或 self-hosted）。
    timeout-minutes: 180
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'incremental')
    # 首批 advisory：先观察 CI 上的真实时长与幸存者噪音，再改阻塞。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # 脚本的自动检测用 `git diff main...HEAD`，需要完整历史。
          fetch-depth: 0

      # checkout 只建 origin/* 不建本地分支；不补这一步 diff 为空 →
      # 三个脚本全部「无改动」静默跳过（假绿）。
      - name: Materialize local main branch
        run: |
          git branch main origin/main 2>/dev/null || true
          git rev-parse --verify main

      - name: Configure git identity
        run: |
          git config --global user.email "ci@recursive.local"
          git config --global user.name "CI Bot"
          git config --global safe.directory "*"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-mutants-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mutants-cargo-

      # 缓存编译好的 cargo-mutants 二进制（与 ci.yml supply-chain 的工具缓存
      # 同款模式；改本 workflow 会换 key 触发重装 —— 这是故意的升级通道）。
      - name: Cache cargo-mutants binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('.github/workflows/mutants.yml') }}

      - name: Install cargo-mutants
        run: command -v cargo-mutants >/dev/null 2>&1 || cargo install cargo-mutants --locked

      - name: Show diff scope
        run: |
          echo "changed files vs main:"
          git diff --name-only main...HEAD | sed 's/^/  /'

      # 顺序跑三个门脚本：各自按 crate 目录过滤 diff，未动即秒级跳过，
      # 所以总时长 ≈ 命中的那一个 crate 的成本，而非三者之和。
      - name: agent-mutants (recursive-agent)
        run: bash .dev/scripts/agent-mutants.sh

      - name: tui-mutants (recursive-tui)
        run: bash .dev/scripts/tui-mutants.sh

      - name: cli-mutants (recursive-cli)
        run: bash .dev/scripts/cli-mutants.sh

  full-baseline:
    name: mutants --all (${{ matrix.crate }})
    runs-on: ubuntu-latest
    # 4h，控制在托管 runner 的 6h 单 job 上限内，且给 4 核降速留余量。
    timeout-minutes: 330
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full' && inputs.agent_shards == '')
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: recursive-agent
            script: agent-mutants.sh
          - crate: recursive-cli
            script: cli-mutants.sh
          - crate: recursive-tui
            script: tui-mutants.sh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1   # --all 全量基线，不 diff，浅检出即可

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-mutants-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mutants-cargo-

      - name: Cache cargo-mutants binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('.github/workflows/mutants.yml') }}

      - name: Install cargo-mutants
        run: command -v cargo-mutants >/dev/null 2>&1 || cargo install cargo-mutants --locked

      # --jobs 4 = copy 模式 4 副本（runner 4 核）。磁盘兜底：CARGO_PROFILE_
      # DEV_DEBUG=0 已在 workflow 级设置；仍吃紧就降到 --jobs 2。
      - name: Run full-crate mutation baseline
        run: bash .dev/scripts/${{ matrix.script }} --all --jobs 4

  regression:
    name: full compile regression (all features)
    runs-on: ubuntu-latest
    # 全特性编译（cloud-runtime 的 aws-sdk/bollard、weixin、otel 都要编）+
    # 全测试套件，4 核冷缓存给 180min（缓存热后显著缩短）。
    timeout-minutes: 180
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.agent_shards == ''
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须 >=2：#184 门 dep_justification::dep_check_script_passes 依赖
          # HEAD~1 解析（fail-closed），浅检出会让整个 job 必红（run 40871284828）。
          fetch-depth: 2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-regression-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-regression-cargo-

      - name: Configure git identity
        run: |
          git config --global user.email "ci@recursive.local"
          git config --global user.name "CI Bot"
          git config --global safe.directory "*"

      # 完整编译回归四件套（AGENTS.md 本地强制门的超集：编译维度开满特性）：
      # 1) 全特性编译 —— 平时 feature-matrix 只逐个 cargo check，这里全量 build；
      # 2) 默认特性全测 —— 与本地 `cargo test --workspace` 门一致；
      # 3) 全特性 clippy -D warnings —— 与本地门一致；
      # 4) fmt --check。
      - name: Build workspace (all features)
        run: cargo build --workspace --all-features

      - name: Test workspace (default features)
        run: cargo test --workspace

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  # ── agent 分片模式（dispatch 专用）────────────────────────────────
  # 动机：recursive-agent 全量 --all ≈9.6k 变异体，4 核 runner 实测吞吐
  # ~78s/个（4 并发 ≈19.5s/个）≈46h，两次 dispatch（40598348438 /
  # 40927380347）均在 330min 处被掐，全量终判永远跑不完。
  # 形制：agent_shards 传 {"shard": [[file,…],…]}（由本地 --list 按变异体
  # 数均衡切分，≤850/片，并集=全集），matrix 展开并行跑，每腿独立
  # 330min 预算。复用 agent-mutants.sh 的 file-args 路径：rc 分诊
  # （rc=3+无 MISSED=pass）与 #241 恢复守卫保持单点；copy 模式不触真源。
  agent-shards:
    name: agent mutants shard (${{ matrix.shard[0] }})
    runs-on: ubuntu-latest
    timeout-minutes: 330
    if: github.event_name == 'workflow_dispatch' && inputs.agent_shards != ''
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        shard: ${{ fromJSON(inputs.agent_shards).shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # 同 regression：#184 门（invariants）依赖 HEAD~1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-mutants-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mutants-cargo-

      - name: Cache cargo-mutants binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('.github/workflows/mutants.yml') }}

      - name: Install cargo-mutants
        run: command -v cargo-mutants >/dev/null 2>&1 || cargo install cargo-mutants --locked

      - name: Run agent mutation shard
        env:
          SHARD_FILES: ${{ join(matrix.shard, ' ') }}
        run: |
          echo "shard: $(echo $SHARD_FILES | wc -w) files"
          bash .dev/scripts/agent-mutants.sh --jobs 4 $SHARD_FILES
