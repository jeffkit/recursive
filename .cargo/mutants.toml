# cargo-mutants project defaults for Recursive.
# Scoped gate scripts (agent/cli/tui-mutants.sh) still pass -p / --features /
# --file; this file excludes known non-product noise so baseline and scoped
# runs don't burn time on fixtures or unobservable surface area.
#
# Docs: https://mutants.rs/config-file.html

# Test helper binaries are not product code; surviving mutants there are not debt.
exclude_globs = [
    "tests/bin/**/*.rs",
]

# Regexes match the mutant *name* string cargo-mutants prints.
exclude_re = [
    # Display/Debug fmt bodies are unobservable from unit tests.
    "impl .*Display.*>::fmt",
    "impl .*Debug.*>::fmt",
    # Long-running server entrypoint; covered by e2e/http suites, not unit mutants.
    "serve_with_graceful_shutdown",
    # render_empty_state's vertical-centre guard: when area.height ==
    # content_h, both `>` and `>=` produce pad=0 and identical output, so the
    # `>`→`>=` mutant is equivalent and unobservable from rendered output.
    "replace > with >= in render_empty_state",
    # Issue #223 batch 3 (CI run 39943859391), true-equivalence mutants per the
    # render_empty_state precedent: at `n == len` the `<=` mutant slices from 0
    # and returns the same full vector the `_` arm returns, so `<` vs `<=` are
    # extensionally equal over all inputs. Boundary rows (tail == len / tail
    # == 0, full content pinned) live in the tail_entries / tail_messages tests;
    # two CI runs reported MISSED with those rows in place.
    "replace < with <= in tail_entries",
    "replace < with <= in tail_messages",
    # Same batch: a blank env value that slips past the mutated guard fails
    # `parse::<u64>()` and lands on the same `Some(DEFAULT_SECS)` the `_` arm
    # returns — every input maps to the same output under both guards.
    "with true in plan_approval_timeout_secs",
    # Issue #228 (CI run 40037188940), hardening.rs re-exec family — true
    # equivalences per the #223 batch-3 doctrine (guard test + argument):
    # `dedup_by(|a, b| a.0 == b.0)` in CredentialHandoff::capture only ever
    # matters if the environment held two entries under one name, and
    # setenv(3) replaces — duplicates are not constructible through the std
    # API (hostile hand-crafted execve environ is the only channel and is
    # out of any in-process test's reach). Guard test:
    # hardening::tests::std_env_yields_one_entry_per_name_the_dedup_precondition.
    "replace == with != in CredentialHandoff::capture",
    # ── Issue #228 batch 2 (CI run 40114354611: 71 mutants → 31 MISSED) ────
    # The re-exec handoff family below lives in
    # `#[cfg(all(unix, not(target_os = "linux")))]` arms: the ubuntu mutation
    # gate never compiles those lines, so every mutant there builds
    # byte-identical to the baseline and reports MISSED no matter what the
    # tests assert (that run scored even the type-invalid `Instant *
    # Duration` mutant MISSED — proof the lines are compiled out, not merely
    # untested). Every mutant excluded here is pinned where the code actually
    # compiles by the named guard tests; each pin was re-verified by hand on
    # macOS for this batch (mutation applied → suite red; the two equivalence
    # entries → suite green). The exclusions only stop ubuntu from
    # re-reporting that local kill evidence as noise. If a guard test is ever
    # deleted, delete its exclusion with it.
    #
    # REGEX WARNING: entries are regexes matched against the printed mutant
    # name — metacharacters in operator names (`+`, `*`) MUST be escaped or
    # the entry silently never matches. Batch 1's `replace - with +` and
    # `replace + with *` entries were inert for exactly that reason, which is
    # why run 40114354611 still listed those survivors. `cargo mutants
    # --list` is the checker: excluded names must disappear from it.
    #
    # capture body → Default::default() (385): ubuntu compiles capture() as
    # `Self::default()` anyway (the linux arm), so the mutant is invisible
    # there; on macOS handoff_capture_takes_predicate_matches_only and
    # handoff_capture_boundary_payloads_round_trip_the_real_pipe_field_by_field
    # both go red under the applied mutation.
    "replace CredentialHandoff::capture -> Self with Default::default()",
    # reexec_clean_env write/exec loop (607 pipe guard, 626/636 write-loop
    # bounds, 633 `/` division, 640 `+=` mutations): pinned by the two-phase
    # self-exec fixture reexec_exec_boundary_self_exec_end_to_end — phase 1
    # (oversize blob → Failed{handoff-write}) kills `n < 0 → ==`, phase 2
    # (real exec; child asserts sentinel=1, knob riding, Restored{count:1},
    # byte-exact credential) kills the pipe guard, both bounds, the division
    # and both `+=` mutations; `written < len → <=` degenerates into a
    # zero-byte-write hang that the gate's timeout counts as caught.
    "replace != with == in reexec_clean_env",
    "replace < with (==|>|<=) in reexec_clean_env",
    "replace - with / in reexec_clean_env",
    "replace \\+= with (-|\\*)= in reexec_clean_env",
    # `blob.len() - written → +` is extensionally equivalent — verified by
    # hand for this batch: plain suite green AND the solo self-exec fixture
    # green under the applied mutation. Round one adds zero; later rounds are
    # reachable only once the pipe is full, where both expressions produce
    # the identical EAGAIN → Failed{handoff-write}.
    "replace - with \\+ in reexec_clean_env",
    # reexec_child_envs whitelist (704 body replacements, 707 delete !,
    # 708/709 `&&`/`!=` inversions): killed on macOS by
    # reexec_child_envs_excludes_credentials_and_reserved_names and — across
    # a real process boundary —
    # reexec_child_envs_whitelist_observed_in_a_real_subprocess (credential
    # stripped, knob and plain third-party name riding, exactly one sentinel
    # and one handoff-fd entry carrying the real descriptor).
    "reexec_child_envs",
    # restore_reexec_env drain loop (811 fd<0 guard, 824 deadline, 831 n>0,
    # 833 cap arithmetic, 839 EOF, 843 WouldBlock arm, 844 deadline >=):
    # pinned on macOS by the real-pipe fixtures —
    # restore_negative_fd_lands_on_exact_reason_and_zero_is_not_negative
    # (exact reason at fd=-1; fd=0 the `<`/`<=` pivot),
    # restore_assembles_multi_chunk_blobs_and_restores_every_var and
    # handoff_capture_boundary_payloads_round_trip_the_real_pipe_field_by_field
    # (multi-chunk assembly, `*`→`+` cap arithmetic, field-by-field restore),
    # restore_cap_boundary_restores_at_256k_exactly_and_rejects_beyond (the
    # 256 KiB exact boundary), and
    # restore_parks_through_wouldblock_until_late_data_arrives /
    # restore_times_out_an_open_quiet_pipe_at_the_deadline (WouldBlock arm,
    # deadline arithmetic, elapsed lower bound). The `+ → *` deadline mutant
    # is type-invalid (E0369, verified by hand) — unviable on every target
    # that compiles the line, so ubuntu reporting it MISSED is the
    # cfg-blindness proof in its purest form.
    "restore_reexec_env",
    # ── Issue #243 (CI run 40167681411), SessionWriter::create_with_tools
    # directory-allocation loop — true equivalences, each verified by hand:
    # mutation applied → full writer suite green (27 tests incl. the guard
    # tests first_session_gets_the_clean_timestamped_id and
    # file_on_the_clean_session_path_retries_to_a_suffixed_id), then
    # byte-exact restore. The four killable siblings of the same loop
    # (delete match arm 0, `>`→`==`, `>`→`>=`, delete `!`) are killed by
    # those two guard tests — keep them out of exclusion scope.
    # `>`→`<`: `attempt < 0` is never true for u32, so the mutant guard
    # reduces to `!exists`; it differs from `attempt > 0 || !exists` only
    # where the directory already exists, and create_dir_all on an existing
    # directory is an Ok no-op — identical state on every input.
    # `||`→`&&`: skipping the outer create_dir_all on attempt 0 changes
    # nothing — SessionLock::acquire runs its own create_dir_all on the
    # session dir (src/session/lifecycle.rs) before opening the sentinel,
    # and every failure path surfaces the same path-less io::Error from
    # whichever of the two redundant creates hits it.
    # `<`→`<=` (retry bound): the original loop can only exit via break
    # (success) or the attempt-7 `Err → return Err(e)`, so the
    # `ok_or_else` fallback below the loop is unreachable; the mutant's
    # generic branch fires only when attempt 7's acquire fails, which
    # would require pre-placing a live lock under a random 8-hex suffix —
    # outside any deterministic test's reach.
    "replace > with < in SessionWriter::create_with_tools",
    "replace \\|\\| with && in SessionWriter::create_with_tools",
    "replace < with <= in SessionWriter::create_with_tools",
    # Issue #243 batch 2: the same retry bound as guard-expression replacement
    # (`attempt < 7` → `true`, :129:27). Two walls make the divergence
    # unreachable from a deterministic test, hand-verified this batch
    # (mutation applied → full writer suite 28/28 green → byte-exact
    # restore): (1) attempts 1–7 unconditionally run
    # `create_dir_all(&session_dir)?` first, so every filesystem-level denial
    # (read-only parent, ENAMETOOLONG, ENOTDIR) surfaces through `?` —
    # identically under both variants — and never reaches the match; (2) an
    # attempt's Err arm therefore requires the freshly created writable
    # directory to fail `SessionLock::acquire`, whose first action (exclusive
    # create_new of the sentinel) succeeds on exactly such a directory;
    # pre-placing a lock under the attempt's random 8-hex uuid suffix is the
    # only remaining channel and is outside deterministic reach. The
    # killable siblings of the same guard (`with false`, `<`→`==`, `<`→`>`,
    # all killed by the stray-file retry test's attempt-0 acquire failure)
    # stay in scope — the regex is name-specific on `with true`.
    "replace match guard attempt < 7 with true in SessionWriter::create_with_tools",
    # ── Issue #245 batch 1 (CI run 40256596759), claude_json.rs — true
    # equivalences, each hand-verified this batch: mutation applied → full
    # claude_json suite green (18 tests), then byte-exact restore. The 24
    # killable siblings in the same file are pinned by the new tests
    # (resolve_unknown_format_falls_back_to_the_flags,
    # assistant_text_becomes_an_assistant_message_and_feeds_num_turns,
    # usage_events_accumulate_and_backstop_result_usage,
    # latency_events_accumulate_into_duration_api_ms,
    # compacted_event_emits_a_compact_boundary_frame,
    # hook_events_emit_started_progress_and_response_frames,
    # partial_tokens_stay_off_the_wire_unless_enabled,
    # println_json_body_is_pinned_to_source) — keep them out of exclusion
    # scope.
    #
    # Two `delete match arm` mutants fall into the `#[non_exhaustive]`
    # catch-all `_ => Vec::new()` whose body is the same `Vec::new()` the
    # deleted arms return: the big internal-event drop arm (TurnFinished |
    # PartialToken | PartialReasoning | … — note PartialToken also has the
    # guarded arm above, which this arm only receives when
    # include_partial_messages is false, and the catch-all drops it
    # identically) and WorkerEvent (issue #119 drop contract, pinned
    # behaviourally by internal_events_stay_off_the_claude_wire).
    # REGEX SCOPE: the bare `{..}` discriminates these two arms from the
    # killable `TurnFinished{ref reason, steps}` / `WorkerEvent{ref …}`
    # arm deletions in cli/output.rs (stream_events / stream_events_repl),
    # which must stay in scope.
    "delete match arm AgentEvent::TurnFinished\\{\\.\\.\\}",
    "delete match arm AgentEvent::WorkerEvent\\{\\.\\.\\}",
    # Five `delete match arm FinishReason::…` mutants in
    # ClaudeJsonEmitter::build_result: each explicit arm's error string is
    # byte-identical to `finish.to_string()` (Display in
    # src/agent/types.rs) that the catch-all arm emits, and subtype /
    # is_error already match. The byte-equality is pinned by
    # finish_error_arms_stay_byte_equal_to_display — if Display drifts from
    # an arm literal, that test goes red and the mutant becomes killable:
    # delete the exclusion with it. The `in ClaudeJsonEmitter::build_result`
    # tail keeps the killable sibling arm deletions in cli/output.rs
    # (print_finish_note / exit_for_finish) in scope.
    "delete match arm FinishReason::Cancelled in ClaudeJsonEmitter::build_result",
    "delete match arm FinishReason::Stuck.*in ClaudeJsonEmitter::build_result",
    "delete match arm FinishReason::TranscriptLimit.*in ClaudeJsonEmitter::build_result",
    "delete match arm FinishReason::PermissionDenialLimit in ClaudeJsonEmitter::build_result",
    "delete match arm FinishReason::ProviderStop.*in ClaudeJsonEmitter::build_result",
    # ── Issue #245 batch 3 (CI run 40256596759), cli/init.rs — two
    # context-equivalents, each hand-verified this batch: mutation applied →
    # full init pin suite green (4 unit tests in cli/init.rs + 6 wizard
    # subprocess tests + 1 workspace pin in crates/recursive-cli/tests/),
    # then byte-exact restore. The 26 killable siblings in the same two
    # files are pinned by those tests — keep them out of exclusion scope.
    #
    # REGEX SCOPE: cargo-mutants matches exclude_re against the full
    # `file:line:col: name` string, so the line anchor is surgical —
    # verified by probe this batch (a line-anchored pattern removed exactly
    # init.rs:318:49 from --list while the same-named :284:33/:301:49 and
    # :528:51's twin :278:68 all stayed). Operator characters are escaped
    # per the #228 warning above; without the anchor these two names would
    # collide with seven killable same-name mutants in run_init.
    #
    # :318:49 `all_entries.len() + i + 1` → `-`: the Local section always
    # holds exactly one entry (the wizard's display list is the bundled
    # catalog from all_presets(), which ships a single `ollama`), and with
    # i == 0 both `len - i + 1` and `len + i + 1` print the same number.
    # It diverges only if the bundled catalog ever grows a second local
    # preset — delete this exclusion together with that catalog change and
    # the mutant becomes killable by the section-rendering pin.
    "init\\.rs:318:49: replace \\+ with - in run_init",
    # :528:51 `m.name == model` → `!=` inside the `any(...)`: the snapshot
    # block only runs in the manual-preset arm, where `models` is always
    # the fresh `Vec::new()` of the just-built ProviderPreset, so `any` is
    # false under both operators and the push happens either way. The push
    # itself is pinned by
    # cli_init_wizard::manual_accepted_preset_carries_the_typed_model.
    "init\\.rs:528:51: replace == with != in run_init",
    # ── Issue #245 batch 2 (same CI run 40256596759), recursive-cli ─────────
    # crates/recursive-cli/src/otel.rs (14 mutants) is `#[cfg(feature =
    # "otel")] mod otel;` and the cli-mutants gate runs `--features weixin`
    # on top of `default = [web_search, http, acp]` — `otel` is opt-in, so
    # the gate never compiles the file. Every mutant there builds
    # byte-identical to the baseline and reports MISSED regardless of the
    # tests (same cfg-blindness class as the #228 batch-2 entries above;
    # the proof in its purest form is the `init_global_tracer -> Ok((Default,
    # Default))` mutant: type-invalid — E0277, neither `Tracer` nor
    # `OtelGuard` is `Default` — yet scored MISSED). All 13 viable mutants
    # are killed where the file compiles, hand-verified this batch under
    # `cargo test -p recursive-cli --features otel --bin recursive otel::`
    # (each mutation applied → red → byte-exact restore): the pure helpers'
    # six by the pre-existing otel_endpoint_* / otel_service_name_* tests,
    # the env shells' six by otel_endpoint_env_shell_reads_unset_empty_and_set
    # and otel_service_name_env_shell_defaults_and_overrides, the Drop body
    # by otel_guard_drop_shuts_down_the_global_provider. The name string the
    # regex sees carries the file path (verified with `cargo mutants --list
    # -E`), so one path-anchored entry covers the whole file; drop it the day
    # cli-mutants.sh adds `otel` to FEATURES.
    "crates/recursive-cli/src/otel\\.rs:",
    # main.rs `SessionPartitioning { skills_base: dir_skills, .. }` (Goal
    # 431 W2a wiring). `skills_base` only reaches an observable state inside
    # `AppState::session_skill_catalog` *after* a templated skill-source
    # fetch succeeds (src/http/mod.rs: the base is extended with the fetched
    # catalog), and `HttpSkillSource` is https-only by construction — a
    # loopback stub cannot satisfy it, so no black-box test of the binary
    # can reach the merge; every reachable path (no templates → startup
    # catalog; templates + missing label or failed fetch → 503) is
    # identical with the field deleted. Hand-verified this batch: mutation
    # applied → cli_http_partitioning + the http/session suites green →
    # byte-exact restore. The composition itself is pinned in-process by the
    # src/http/mod.rs tests that set `partitioning.skills_base` directly;
    # the two siblings in the same literal (`skill_sources`, `endpoints`)
    # ARE observable through the binary and stay in scope — pinned by
    # tests/cli_http_partitioning.rs.
    #
    # INERT ON cargo-mutants 27.1.0 (the current latest release, and what
    # CI installs): `visit_expr_struct` pushes `Genre::StructField` mutants
    # straight onto the mutant list, bypassing `options.allows_mutant`, so
    # NO exclude_re can touch a `delete field … from struct …` mutant —
    # verified with `cargo mutants --list --file crates/recursive-cli/src/
    # main.rs -E '<regex>'`: `async_main` drops 18 FnValue/operator mutants
    # of the same function while all three StructField mutants stay listed,
    # and even `-E skills_base` / `-E 'delete field'` remove nothing. The
    # upstream main branch already routes the genre through
    # `push_mutant_if_allowed` → `allows_mutant`, so this entry takes effect
    # on the first release after 27.1.0; until then the gate keeps reporting
    # this one mutant MISSED (issue #245 batch-2 ledger carries it as the
    # known residual). Do not "fix" it by respelling the literal without
    # `..Default::default()` — that would also erase the two killable
    # siblings from the gate's view.
    "delete field skills_base from struct recursive::http::SessionPartitioning expression in async_main",
    # ── Issue #245 batch 4 (same CI run 40256596759), cli/output.rs stream
    # family — five exclusions, each hand-verified this batch (mutation
    # applied → target suite run → byte-exact restore; script and log in
    # /tmp/b4-negctl/). The 24 killable siblings are pinned by
    # tests/cli_output_streams.rs (run human stream / resume compaction /
    # subagent worker lines / piped repl / repl json) plus the in-process
    # drain_events unit pin — keep them out of exclusion scope.
    #
    # `:302:31 > → >=` in stream_events' char-boundary walk is extensionally
    # equivalent: `end` is usize, so `end >= 0` is always true and the loop
    # guard reduces to `!output.is_char_boundary(end)` — identical to the
    # original at every input, because `is_char_boundary(0)` is always true
    # and stops the loop before `end -= 1` could reach 0. Verified: mutation
    # applied → full cli_output_streams suite green → byte-exact restore.
    # The killable siblings of the same walk (`<`, `==`, `&&`→`||`, delete
    # `!`, `-=→+=`, `-=→/=`) are pinned by the multi-byte-straddling
    # fixture in run_human_stream_pins_… — the line:col anchor is surgical
    # per the #245 batch-3 doctrine (a same-named operator mutant lives at
    # :300:47 and must stay in scope).
    "output\\.rs:302:31: replace > with >= in stream_events",
    # The three plan arms of stream_events and the PlanProposed arm of
    # stream_events_repl are unreachable from every surface that constructs
    # these printers: `run` and `resume` both build their runtime with
    # `interactive = false` (main.rs), which does not register
    # enter_plan_mode / exit_plan_mode (builder test "a headless run must
    # not register the blocking plan tools"), and the REPL passes false the
    # same way — so no PlanProposed / PlanConfirmed / PlanRejected can be
    # emitted into these printers; the TUI / HTTP hosts that do have plan
    # tools render their own event streams. Verified per arm: deletion
    # applied → full cli_output_streams suite green → byte-exact restore.
    # The `$` tail keeps the observable sibling arm deletions (worker / tool
    # / proposed lines, all pinned) in scope — without it `in stream_events`
    # would also swallow the repl arms.
    "delete match arm AgentEvent::Plan(Proposed\\{ref plan_text, \\.\\.\\}|Confirmed|Rejected\\{ref reason\\}) in stream_events(_repl)?$",
    # ── Issue #245 batch 5 (same CI run 40256596759), cli/output.rs rest of
    # file — print_usage / print_finish_note / exit_for_finish /
    # JsonEventTask::finish_without_result. One exclusion; the other 28 are
    # pinned in output.rs `mod tests` (exact-message exit_for_finish asserts,
    # the finish_without_result pending-until-closed pin, the zero-steps
    # division trap, and the `*_pinned_via_child_process` tests that re-run
    # this test binary with `--exact … --nocapture` to read the printers'
    # stderr). Hand-verified: mutation applied → target tests run → byte-exact
    # restore; script and log in /tmp/b5-negctl/.
    #
    # `:20:43 > → >=` in print_usage's cache-rate guard is extensionally
    # equivalent. The guard `total_cache > 0` sits inside
    # `if usage.cache_hit_tokens > 0`, and `total_cache = cache_hit_tokens +
    # cache_miss_tokens` over u32 — so at every reachable input
    # `total_cache >= cache_hit_tokens > 0` and both `> 0` and `>= 0` are
    # true (the `else { 0.0 }` arm is defensive dead code). A debug build
    # panics on the addition before either comparison could differ; the
    # release-wrap case needs a provider to report ~2^32 cache-miss tokens
    # alongside a cache hit, which no fixture or response produces. Same
    # category as the `:302:31` entry above. Verified: mutation applied →
    # full cli::output::tests green → byte-exact restore. The line:col
    # anchor keeps the four killable `> → >=` siblings in print_usage
    # (`:13:27`, `:18:35`, `:35:29`, `:35:42`, all pinned) in scope.
    "output\\.rs:20:43: replace > with >= in print_usage",
]
